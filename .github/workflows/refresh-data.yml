name: Refresh Bruins Data

# Two schedules sharing one workflow file, split by job via
# github.event.schedule — GitHub Actions triggers schedules at the
# workflow level, not the job level, so this is the standard way to run
# different jobs on different cadences from one file.
#
# Hourly: games, standings, special-teams stats, narratives — all now
# cheap to re-run since backfill-season.ts skips games it already has.
# NHL box scores are typically available within well under an hour of a
# game ending, so hourly keeps the site current without hammering the
# NHL API on a tighter schedule for no real benefit.
#
# Daily (14:00 UTC / ~9-10am ET, comfortably after even a late West Coast
# game and MoneyPuck's own overnight update): xG/Corsi from MoneyPuck.
# MoneyPuck's own site says their data updates nightly, so running this
# more than once a day would just re-process the same numbers.
#
# Off the top of the hour on purpose: GitHub's docs warn scheduled runs are
# delayed at the start of every hour under load, and some queued jobs may
# be dropped. Monthly: a keepalive commit — GitHub disables scheduled
# workflows in a public repo after 60 days with no repository activity,
# which would silently stop this refresh mid-season.
#
# The hourly refresh is scheduled twice an hour (:17 and :47): on
# 2026-10-03 GitHub dropped every hourly run from 10:25 to 18:30 UTC with
# no reported incident, which left rosters stale. A second slot halves the
# odds of a missed hour; a concurrency group keeps two runs from
# overlapping, and the refresh is cheap when there's nothing new.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
    - cron: "23 14 * * *"
    - cron: "41 9 1 * *"
  workflow_dispatch: {}

jobs:
  refresh-current-season:
    if: github.event.schedule == '17 * * * *' || github.event.schedule == '47 * * * *' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: refresh-current-season
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Refresh games, standings, special teams, narratives
        # Its own limit, under the job's, so an overrun here still leaves
        # time for the verify step below.
        timeout-minutes: 24
        run: |
          chmod +x scripts/refresh-current-season.sh
          scripts/refresh-current-season.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Every club's current roster and headshots (32 calls). The Roster
      # pages read this instead of calling the NHL at page-load time. A
      # team whose roster doesn't come back complete keeps its last good
      # roster; never blocks the rest of the run.
      - name: Sync current rosters and headshots
        timeout-minutes: 5
        continue-on-error: true
        run: npx tsx scripts/sync-rosters.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # A brand-new player can land as "A. Smits" (box-score short name)
      # when his team's roster lags; this fills in the real name hourly.
      - name: Repair abbreviated player names
        timeout-minutes: 3
        continue-on-error: true
        run: npx tsx scripts/repair-abbreviated-names.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The homepage's question of the day, answered ahead of time. Calls
      # the model only when today's answer is missing or older than the
      # newest Bruins game (about once a day); never fails the run.
      # Signature Stats history (nhl_* tables): this season's newly
      # finished games, plus a re-check of the last 48 hours for scoring
      # changes. Separate from the site's own tables; never fails the run.
      - name: Ingest stats history
        timeout-minutes: 8
        continue-on-error: true
        run: npx tsx scripts/stats/ingest-recent-games.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Each game's chances (expected goals, deserved to win): new games and
      # the last 48 hours, from the NHL's play-by-play.
      - name: Game chances
        timeout-minutes: 8
        continue-on-error: true
        run: npx tsx scripts/stats/build-game-chances.ts --recent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Warm question of the day
        timeout-minutes: 3
        continue-on-error: true
        run: npx tsx scripts/warm-question-of-the-day.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Last, so a failure never blocks the refresh itself — it flags the
      # run (and emails the workflow's last editor) when any team breaks a
      # data invariant: goalie W-L-OTL must equal the standings, shutouts
      # must be real, one standings row per season, and so on. See
      # scripts/verify-all.ts.
      - name: Verify data invariants
        # Runs even if the refresh step failed or timed out — that's exactly
        # when the data most needs checking.
        if: always()
        timeout-minutes: 5
        run: npx tsx scripts/verify-all.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Tells the site this job ran (/api/health alerts after 3 hours
      # without one: GitHub dropped eight hours of runs on 2026-10-03).
      - name: Record that the hourly refresh ran
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: npx tsx scripts/ops-heartbeat.ts hourly-refresh ${{ job.status == 'success' && 'ok' || 'failed' }} "GitHub run ${{ github.run_id }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  refresh-moneypuck:
    if: github.event.schedule == '23 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Compute current NHL season's start year
        id: season
        run: |
          YEAR=$(node -e '
            const now = new Date();
            const y = now.getUTCFullYear();
            console.log(now.getUTCMonth() >= 8 ? y : y - 1);
          ')
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
      - name: Team-level xG/Corsi (MoneyPuck)
        run: npx tsx scripts/backfill-moneypuck.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Signature Stats rebuilds (spec section 3: rebuild_derived after
      # ingest): data tiers, derived tables, and game labels, from scratch.
      - name: Rebuild stats audit, derived tables and labels
        timeout-minutes: 20
        continue-on-error: true
        run: |
          npx tsx scripts/stats/audit.ts --quiet
          npx tsx scripts/stats/build-derived.ts
          npx tsx scripts/stats/build-game-labels.ts
          npx tsx scripts/stats/verify-iconic-games.ts
          npx tsx scripts/stats/build-elo.ts
          npx tsx scripts/stats/verify-elo-sql.ts
          npx tsx scripts/stats/build-wp.ts
          npx tsx scripts/stats/test-wp.ts
          npx tsx scripts/stats/build-leverage.ts
          npx tsx scripts/stats/test-leverage.ts
          npx tsx scripts/stats/test-xg.ts
          npx tsx scripts/stats/build-grudge.ts
          npx tsx scripts/stats/test-grudge.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Reliability guard (docs/verification.md, layer 6): the site's data
      # against the NHL's own, every morning, with a fresh random sample of
      # box scores and careers plus standings and the Bruins' season. Runs
      # at 10 AM ET, when no games are in progress. Fails the run (GitHub
      # emails) on any difference.
      # Any finished game not loaded yet goes in first: GitHub started this
      # job six hours late on 2026-10-04, after an afternoon game ended but
      # before anything loaded it, and every check below failed on it.
      - name: Load any finished games
        timeout-minutes: 5
        continue-on-error: true
        run: npx tsx scripts/load-finished-games.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cross-check the site's data against the NHL
        timeout-minutes: 15
        run: npx tsx scripts/qa/cross-check-nhl.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Every team's live Roster page against the NHL's current roster:
      # every rostered player must be listed (McAvoy once wasn't, 2026-10-02).
      - name: Check every Roster page against the NHL
        timeout-minutes: 5
        run: npx tsx scripts/qa/check-rosters.ts https://causeway-ten.vercel.app
      - name: Player-level xG/Corsi (MoneyPuck), current season only
        run: npx tsx scripts/backfill-moneypuck-players.ts ${{ steps.season.outputs.year }} ${{ steps.season.outputs.year }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Every player's season totals, every season since 1917-18 and every
      # player (Ask reads them all), against the NHL's own: GP, goals,
      # assists, goalie decisions. Found the shootout-only goalies, resumed
      # games and the 1988 blackout game (2026-10-03). Known NHL
      # self-contradictions are listed in the script; anything else fails.
      - name: Audit every player's season totals against the NHL
        if: always()
        timeout-minutes: 50
        run: npx tsx scripts/qa/audit-season-totals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Every player page's career totals (what the page itself computes)
      # against the NHL's official career totals.
      - name: Check every player page's career totals against the NHL
        if: always()
        timeout-minutes: 40
        run: npx tsx scripts/qa/check-player-careers.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Repository activity once a month so GitHub never auto-disables the
  # schedules above (60 days of inactivity in a public repo). A dated file
  # rather than an empty commit, so the history says what it's for.
  keepalive:
    if: github.event.schedule == '41 9 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: monthly keepalive for scheduled workflows"
          git push
